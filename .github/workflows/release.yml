name: build

# Tag push (v*) -> build and publish a GitHub Release with the Magisk module,
# the hand mesh blob, checksums and the license files.
# Manual run (workflow_dispatch) -> build only and upload the artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Installs the command-line tools, accepts the SDK licenses and sets
      # ANDROID_SDK_ROOT. build.ps1 reads that variable.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK 26.1 and CMake 3.22.1
        shell: pwsh
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          sdkmanager --list_installed

      # Builds VdHsMod.dll + libvdhs.so + the Zygisk injector, stages
      # zygisk/payload/, and packs zygisk/dist/vdhs_zygisk.zip.
      - name: Build Magisk module
        shell: pwsh
        run: pwsh -NoProfile -File zygisk/build.ps1 -Pack

      - name: Verify packaged payload
        shell: pwsh
        run: |
          $zip  = "zygisk/dist/vdhs_zygisk.zip"
          $mesh = "assets/mesh/hand_mesh_fb.bin"
          foreach ($f in @($zip, $mesh)) {
            if (-not (Test-Path $f)) { throw "missing build output: $f" }
          }
          Get-ChildItem -Recurse zygisk/payload -File |
            ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.Name }

      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          $files = @("zygisk/dist/vdhs_zygisk.zip", "assets/mesh/hand_mesh_fb.bin")
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: vdhs_zygisk
          path: |
            zygisk/dist/vdhs_zygisk.zip
            assets/mesh/hand_mesh_fb.bin
            SHA256SUMS.txt

      - name: Publish GitHub Release (tag runs)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            zygisk/dist/vdhs_zygisk.zip
            assets/mesh/hand_mesh_fb.bin
            SHA256SUMS.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
          body: |
            **VD-PicoEnhance** — PICO hand tracking, hand passthrough and
            eye-gaze for the **unmodified official** Virtual Desktop on
            **PICO 4 Pro** (root + Magisk/Zygisk).

            Tested only on Virtual Desktop Android **1.34.22.0** + **PICO 4 Pro**.
            Experimental; other Virtual Desktop versions and devices are untested.

            ### Files
            - `vdhs_zygisk.zip` — Magisk/Zygisk module. Install via
              **Magisk → Modules → Install from storage**, then reboot. The
              shipped `payload/mode.txt` is `1` (injection smoke test); set it to
              `2` for the full compatibility layer.
            - `hand_mesh_fb.bin` — the hand mesh in `XR_FB_hand_tracking_mesh`
              format. Push it to
              `/data/data/VirtualDesktop.Android/vdhs/hand_mesh_fb.bin`.
              Converted from the headset's own PICO system resource; see
              `assets/mesh/README.md` for provenance and disclaimer.
            - `SHA256SUMS.txt`, `LICENSE`, `THIRD_PARTY_NOTICES.md`.

            ### Disclaimer
            Unofficial community project, not affiliated with Virtual Desktop or
            PICO. It does not modify the Virtual Desktop APK and does not bypass
            any license. A root module against a third-party app is used at your
            own risk. The bundled `hand_mesh_fb.bin` is a PICO system asset
            included only to make the hand-mesh feature work and will be removed
            on request.
