name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Magisk module
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install pinned NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Verify version
        run: |
          $ErrorActionPreference = 'Stop'
          $props = Get-Content -Raw zygisk/module.prop
          $version = ([regex]::Match($props, '(?m)^version=(.+)$')).Groups[1].Value.Trim()
          if (-not $version) { throw 'module.prop has no version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $($env:GITHUB_REF_NAME) must be v$version (module.prop version)"
          }
          "MODULE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build hook and module
        run: pwsh -NoProfile -File zygisk/build.ps1 -Pack

      - name: Prepare release assets
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'zygisk/dist/vdhs_zygisk.zip'
          $mesh = 'assets/mesh/hand_mesh_fb.bin'
          foreach ($f in @($zip, $mesh)) { if (-not (Test-Path -LiteralPath $f)) { throw "missing build output: $f" } }
          $directory = New-Item -ItemType Directory -Force -Path artifacts/release
          foreach ($f in @($zip, $mesh, 'tools/install-vd-picoenhance.ps1', 'LICENSE', 'THIRD_PARTY_NOTICES.md')) {
            Copy-Item -LiteralPath $f -Destination $directory.FullName -Force
          }
          Push-Location $directory.FullName
          try {
            $names = Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object { $_.Name } | Sort-Object
            $text = (($names | ForEach-Object {
              "$((Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $_"
            }) -join "`n") + "`n"
            # LF only: the checksum file is consumed by sha256sum on Linux.
            [IO.File]::WriteAllText((Join-Path $directory.FullName 'SHA256SUMS.txt'), $text, [Text.UTF8Encoding]::new($false))
            # Extracting the bundle puts the installer and its inputs together.
            # Its checksum file covers the contents; the external copy also covers the bundle.
            $bundle = "VD-PicoEnhance-v$env:MODULE_VERSION.zip"
            Compress-Archive -LiteralPath (@($names) + 'SHA256SUMS.txt') -DestinationPath $bundle
            $bundleHash = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::AppendAllText((Join-Path $directory.FullName 'SHA256SUMS.txt'), "$bundleHash  $bundle`n", [Text.UTF8Encoding]::new($false))
            Get-Content SHA256SUMS.txt
          } finally { Pop-Location }

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module
          path: release

      - name: Publish verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check --strict SHA256SUMS.txt
          bundle="VD-PicoEnhance-${RELEASE_TAG}.zip"
          test -f "$bundle"
          gh release create "$RELEASE_TAG" \
            --verify-tag --generate-notes \
            --title "VD-PicoEnhance $RELEASE_TAG" \
            "$bundle"
