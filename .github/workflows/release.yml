name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build base and optional Knuckles module
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install pinned Android build inputs
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify version
        run: |
          $ErrorActionPreference = 'Stop'
          $props = Get-Content -Raw zygisk/module.prop
          $version = ([regex]::Match($props, '(?m)^version=(.+)$')).Groups[1].Value.Trim()
          if (-not $version) { throw 'module.prop has no version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $($env:GITHUB_REF_NAME) must be v$version (module.prop version)"
          }
          "MODULE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build hook and module
        run: |
          if (-not $env:JAVA_HOME_17_X64) { throw 'Hosted JDK 17 is required.' }
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          pwsh -NoProfile -File zygisk/build.ps1 -Pack

      - name: Build portable PC capsule
        run: pwsh -NoProfile -File pc/driver/build.ps1

      - name: Install pinned Zig and Python build dependency
        run: |
          python -m pip install pefile==2024.8.26
          if ($LASTEXITCODE) { throw 'Python dependency installation failed.' }
          $zip = Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd859994725ef9402381e557c60bb57497215682e355204d754ee3df75ee3c158') { throw 'Zig archive differs from the pinned release.' }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP
          "ZIG=$env:RUNNER_TEMP/zig-windows-x86_64-0.13.0/zig.exe" >> $env:GITHUB_ENV

      - name: Build optional provider and headset daemon
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          pwsh -NoProfile -File knuckles/build.ps1 -Zig $env:ZIG
          if ($LASTEXITCODE) { throw 'Optional module build failed.' }

      - name: Check source and distributable boundaries
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          python -B -X utf8 -m unittest discover -s tools/checks -p 'test_*.py' -v
          if ($LASTEXITCODE) { throw 'Source regression failed.' }
          python -B -X utf8 -m unittest discover -s mod/native/checks -p 'test_*.py' -v
          if ($LASTEXITCODE) { throw 'Native capability regression failed.' }
          pwsh -NoProfile -File tools/checks/test-pack-module.ps1
          if ($LASTEXITCODE) { throw 'Module ZIP check failed.' }
          pwsh -NoProfile -File tools/checks/test-pc-package.ps1 -PackagePath pc/driver/build
          if ($LASTEXITCODE) { throw 'PC capsule check failed.' }
          pwsh -NoProfile -File tools/checks/test-knuckles-manager.ps1
          if ($LASTEXITCODE) { throw 'Optional Knuckles manager check failed.' }
          pwsh -NoProfile -File tools/checks/test-unified-installer.ps1 -InstallerPath tools/install-vd-picoenhance.ps1
          if ($LASTEXITCODE) { throw 'Unified installer check failed.' }

      - name: Prepare release assets
        run: pwsh -NoProfile -File tools/pack-release.ps1

      - name: Verify complete release bundle
        run: pwsh -NoProfile -File tools/checks/test-release-package.ps1 -BundlePath "artifacts/release/VD-PicoEnhance-v${{ env.MODULE_VERSION }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module
          path: release

      - name: Publish verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check --strict SHA256SUMS.txt
          bundle="VD-PicoEnhance-${RELEASE_TAG}.zip"
          test -f "$bundle"
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            --verify-tag --notes-file RELEASE_NOTES.md \
            --title "VD-PicoEnhance $RELEASE_TAG" \
            "${flags[@]}" \
            "$bundle"
